<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 290" fill="none">
  <defs>
    <linearGradient id="ryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="ryNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#091526" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ryAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="ryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Luxury Emblem Graphic -->
  <g transform="translate(65, 14)" filter="url(#ryShadow)">
    <!-- Shield / Diamond Crest Outer Frame -->
    <path d="M 145 8 L 248 42 L 248 138 L 145 186 L 42 138 L 42 42 Z" 
          fill="url(#ryNavy)" 
          stroke="url(#ryGold)" 
          stroke-width="3.5" 
          stroke-linejoin="round"/>
    
    <!-- Inner Accent Inset -->
    <path d="M 145 18 L 236 48 L 236 132 L 145 174 L 54 132 L 54 48 Z" 
          fill="none" 
          stroke="url(#ryGold)" 
          stroke-width="1.2" 
          stroke-dasharray="4 3" 
          opacity="0.6"/>

    <!-- Stylized 'RY' Monogram -->
    <!-- R Letter -->
    <path d="M 98 64 L 98 128 M 98 64 L 126 64 Q 146 64 146 84 Q 146 104 126 104 L 98 104 M 122 104 L 146 128"
          fill="none"
          stroke="url(#ryAccent)"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Y Letter -->
    <path d="M 160 64 L 178 94 L 196 64 M 178 94 L 178 128"
          fill="none"
          stroke="url(#ryAccent)"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Elegant Gold Arc / Orbital Ring -->
    <path d="M 22 108 C 50 162, 238 174, 268 96 C 242 118, 112 128, 35 105 Z" 
          fill="url(#ryGold)" 
          opacity="0.95"/>
          
    <!-- Star Accent at Apex -->
    <polygon points="145,24 148,32 156,32 150,37 152,45 145,40 138,45 140,37 134,32 142,32" 
             fill="url(#ryAccent)"/>
  </g>

  <!-- Brand Typography: RY PRIME SERVICE -->
  <text x="210" y="232" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="22" 
        font-weight="900" 
        fill="#0f172a" 
        letter-spacing="2">
    RY PRIME SERVICE
  </text>

  <!-- Subtitle: — LLC — -->
  <g transform="translate(210, 264)">
    <line x1="-70" y1="-5" x2="-25" y2="-5" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="0" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="15" 
          font-weight="800" 
          fill="#d97706" 
          letter-spacing="5">
      LLC
    </text>
    <line x1="25" y1="-5" x2="70" y2="-5" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
